name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: decode keystore
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > zmt.keystore

      - name: lint
        run: ./gradlew :app:lintRelease

      - name: run unit tests
        run: ./gradlew testDebugUnitTest

      - name: resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "name=$(gh release view --json tagName --jq .tagName | sed 's/^v//')-ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: clean and build signed release
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_PATH: zmt.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleRelease -PversionOverride=${{ steps.version.outputs.name }}
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Built APK: $apk"
          ls -la "$apk"
          # Verify signing
          keytool -printcert -jarfile "$apk" 2>&1 | head -10

      - name: build unsigned (PR)
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleRelease

      - name: upload release apk
        uses: actions/upload-artifact@v7
        with:
          name: zmt-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

            "https://api.telegram.org/bot${{ TELEGRAM_BOT_TOKEN }}/sendDocument" > /dev/null
