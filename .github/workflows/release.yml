name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TELEGRAM_API_ID: 1535417
  TELEGRAM_API_HASH: 680c59342dffae3c680ee8a9c37f39be

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: set up android sdk
        uses: android-actions/setup-android@v3

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: install NDK and CMake
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null 2>&1 || true

      - name: set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: resolve version
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: decode keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > zmt.keystore

      - name: build signed release apk and aab
        env:
          SIGNING_KEYSTORE_PATH: zmt.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TELEGRAM_API_ID: ${{ env.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ env.TELEGRAM_API_HASH }}
        run: ./gradlew assembleRelease bundleRelease -PversionOverride=${{ steps.version.outputs.name }} --no-configuration-cache

      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
