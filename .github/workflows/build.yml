name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  TELEGRAM_API_ID: 1535417
  TELEGRAM_API_HASH: 680c59342dffae3c680ee8a9c37f39be

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: set up android sdk
        uses: android-actions/setup-android@v3

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: install NDK and CMake
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null 2>&1 || true

      - name: set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: lint
        run: ./gradlew :app:lintRelease --no-configuration-cache

      - name: run unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache

      - name: resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "name=$(gh release view --json tagName --jq .tagName | sed 's/^v//')-ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: build unsigned release
        env:
          TELEGRAM_API_ID: ${{ env.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ env.TELEGRAM_API_HASH }}
        run: ./gradlew clean assembleRelease -PversionOverride=${{ steps.version.outputs.name }} --no-configuration-cache

      - name: sign APK
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_API_ID: ${{ env.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ env.TELEGRAM_API_HASH }}
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > /tmp/zmt.keystore
          apk=$(ls app/build/outputs/apk/release/*-unsigned.apk 2>/dev/null || ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $apk"
          ls -la "$apk"
          keytool -printcert -jarfile "$apk" 2>&1 | head -3 || true
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "Build tools: $BUILD_TOOLS"
          ${BUILD_TOOLS}zipalign -f 4 "$apk" /tmp/zmt-aligned.apk
          ${BUILD_TOOLS}apksigner sign \
            --ks /tmp/zmt.keystore \
            --ks-pass pass:${{ secrets.SIGNING_STORE_PASSWORD }} \
            --key-pass pass:${{ secrets.SIGNING_KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.SIGNING_KEY_ALIAS }} \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            /tmp/zmt-aligned.apk
          keytool -printcert -jarfile /tmp/zmt-aligned.apk 2>&1 | head -10
          cp /tmp/zmt-aligned.apk "$apk"
          echo "Signed!"

      - name: upload release apk
        uses: actions/upload-artifact@v7
        with:
          name: zmt-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
